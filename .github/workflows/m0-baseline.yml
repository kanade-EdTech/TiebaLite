name: M0 Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: m0-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install baseline Android SDK
        run: sdkmanager "platforms;android-29" "build-tools;28.0.3"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      # M0 records the existing Lint debt without hiding it. Remove
      # continue-on-error after the baseline MissingPermission error is fixed.
      - name: Generate Lint baseline report
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tieba-lite-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  device-smoke:
    name: API ${{ matrix.api-level }} install and launch
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: tieba-lite-debug
          path: artifacts/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on API ${{ matrix.api-level }}
        # v2.38.0 pinned to its full commit SHA.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            APK_PATH="$(find artifacts/apk -name '*.apk' -print -quit)"
            test -n "$APK_PATH"
            adb install -r "$APK_PATH"
            adb shell am force-stop com.huanchengfly.tieba.post
            adb shell monkey -p com.huanchengfly.tieba.post -c android.intent.category.LAUNCHER 1
            sleep 10
            APP_PID="$(adb shell pidof com.huanchengfly.tieba.post | tr -d '\r')"
            test -n "$APP_PID"
            EVIDENCE_DIR="m0-device-evidence/api-${{ matrix.api-level }}"
            mkdir -p "$EVIDENCE_DIR"
            adb exec-out screencap -p > "$EVIDENCE_DIR/launch.png"
            adb shell dumpsys activity activities > "$EVIDENCE_DIR/activity.txt"
            adb shell dumpsys package com.huanchengfly.tieba.post > "$EVIDENCE_DIR/package.txt"
            adb logcat -d -t 500 > "$EVIDENCE_DIR/logcat.txt"

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-device-evidence-api-${{ matrix.api-level }}
          path: m0-device-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
