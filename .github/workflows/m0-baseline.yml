name: M0 Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: m0-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        # Android command-line tools 22.0 require JDK 17 or later.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # v4.0.4 uses the Node.js 24 runtime required by current hosted runners.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install baseline Android SDK
        run: sdkmanager "platforms;android-29" "build-tools;28.0.3"

      - name: Set up JDK 8 for legacy Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "8"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check UI test helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_m0_ui_flows.py' -v

      - name: Run unit tests and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain

      # M0 records the existing Lint debt without hiding it. Remove
      # continue-on-error after all baseline errors are fixed, including
      # MissingPermission and UseRequireInsteadOfGet.
      - name: Generate Lint baseline report
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tieba-lite-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  device-smoke:
    name: API ${{ matrix.api-level }} account-free UI flows
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]

    steps:
      - name: Checkout smoke test script
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: tieba-lite-debug
          path: artifacts/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on API ${{ matrix.api-level }}
        # v2.38.0 pinned to its full commit SHA.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action executes each input line in a separate sh process.
          script: bash .github/scripts/m0-device-smoke.sh ${{ matrix.api-level }}

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-device-evidence-api-${{ matrix.api-level }}
          path: m0-device-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
